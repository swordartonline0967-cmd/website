# ============================================================
#  サイトを GitHub Pages で公開するための自動処理
# ============================================================
#  ・main ブランチに変更が保存（push）されるたびに、サイトを作り直して公開します
#  ・毎日 朝5時（日本時間）にも作り直します（「今日は何の日」「発売予定」を最新にするため）
#  ・GitHub の「Actions」タブから手動で実行することもできます
#  初回だけ、リポジトリの Settings → Pages → Source を「GitHub Actions」にしてください。
#  詳しくは docs/01-公開手順.md を見てください。
name: サイトを公開（GitHub Pages）

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 20 * * *' # 毎日 20:00 UTC = 翌日 5:00 日本時間
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - name: データのチェック
        run: npm run data:validate
      - name: サイトを作る（ビルド）
        run: npm run build
        env:
          # 公開URL（独自ドメインを設定した場合も自動で切り替わります）
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
